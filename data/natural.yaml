# Natural footage with real light sources that flash, from Wikimedia Commons (read by
# synth/fetch_natural.py and eval/natural.py). Every file is openly licensed; nothing is
# redistributed: the fetch script downloads each one to data/natural/ (gitignored).
#
# Labels come from EA IRIS 1.1.0 (BSD-3-Clause), the official Ubuntu example app from EA's GitHub
# release, run on the same H.264 transcode SteadyFrame analyzes. Before use it is checked against
# IRIS's own expected logs for three of its test videos. Nothing below comes from this analyzer.
#
# sha1: the Commons file version (from the API); sha256: the downloaded file; mp4_sha256: the
# transcode both tools read; iris_sha256: IRIS's per-frame CSV for it. The fetch script refuses a
# file whose checksum differs; `--freeze` records them after the first run.

iris:
  url: https://github.com/electronicarts/IRIS/releases/download/1.1.0/iris-1.1.0-ubuntu-example-app.tar.gz
  sha256: 440eb0cb814a03a4eff7c8c4f499492b669a33cf2ba4f23843b479365eeedaeb
  licence: BSD-3-Clause (Copyright (c) 2023 Electronic Arts Inc.)


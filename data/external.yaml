# Labels for the external clips listed in data/SOURCES.md (downloaded by `make real` to
# data/real/). Read by eval/external.py, which refuses to score a file whose sha256 differs
# from the one recorded here. No label below was produced by the SteadyFrame analyzer.
#
# label kinds
#   iris_log        IRIS's own expected per-frame results for the clip (reference: <id>).
#                   Frame codes: 0 pass, 1 pass with warning, 2 extended failure, 3 flash
#                   failure. flashStripes uses IRIS's older log layout with a single
#                   FlashFailedFrames column where 2 marks a flash failure (it starts at the
#                   seventh transition, 0.28 s in, so it cannot be the 4 s extended rule).
#   frame_mean_ref  synth/reference.py (the independent 1-D implementation of the rules) run
#                   on the frame-mean relative luminance with the area condition taken as met.
#                   Valid only for spatially uniform flashing; the script checks that every
#                   quadrant's mean stays within `uniform_tol` of the frame mean and refuses
#                   the label otherwise.
#   pass            calm camera footage: no flashing light sources, checked by looking at
#                   stills across each clip. Every second is labelled pass.


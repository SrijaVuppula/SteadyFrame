name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -q --upgrade pip
      - run: make install
      - run: make lint
      - run: make test
      - name: opencv version (must be 5.x)
        run: .venv/bin/python -c "import cv2; print(cv2.__version__); assert cv2.__version__.startswith('5.')"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: test -f package-lock.json && npm ci || echo "no frontend yet"
      - run: test -f package.json && npm run build --if-present || true
      - run: test -f package.json && npm run a11y --if-present || true

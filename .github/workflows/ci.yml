name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -q --upgrade pip
      - run: make install
      - run: .venv/bin/pip install -q -r infra/requirements-infra.lock
      - run: make lint
      - run: make test
      - name: opencv version (must be 5.x)
        run: .venv/bin/python -c "import cv2; print(cv2.__version__); assert cv2.__version__.startswith('5.')"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: accessibility check (axe, fixture mode)
        run: npm run a11y
      - uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: web/a11y-report.json

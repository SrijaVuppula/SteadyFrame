<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 840" width="1700" height="840" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">SteadyFrame on AWS</title>
  <desc id="d">The browser talks to API Gateway and an API Lambda that creates jobs in DynamoDB and puts them on an SQS queue. An arm64 Lambda worker running OpenCV 5 takes each job, kept warm by an EventBridge schedule, with an ECS Fargate fallback. The worker asks Amazon Bedrock to plan repairs from measurements only, and writes outputs to S3, state and traces to DynamoDB, and logs and metrics to CloudWatch. Uploads go straight to S3 by presigned URL.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5578"/></marker>
    <style>
      .box { fill: #ffffff; stroke: #c9cfdf; stroke-width: 2; }
      .compute { fill: #eef2ff; stroke: #5b6ee1; stroke-width: 2.5; }
      .ai { fill: #f4efff; stroke: #7c5ce0; stroke-width: 2.5; }
      .data { fill: #f6f8fb; stroke: #9aa6c2; stroke-width: 2; }
      .dash { fill: #ffffff; stroke: #9aa6c2; stroke-width: 2; stroke-dasharray: 8 6; }
      .h { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 16px; fill: #475569; }
      .l { font-size: 14px; fill: #4a5578; font-weight: 600; }
      .ln { fill: none; stroke: #4a5578; stroke-width: 2; marker-end: url(#a); }
      .ln2 { fill: none; stroke: #4a5578; stroke-width: 2; marker-start: url(#a); marker-end: url(#a); }
      .lnd { fill: none; stroke: #8792ad; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#a); }
      .bus { fill: none; stroke: #4a5578; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1700" height="840" fill="#ffffff"/>
  <text x="40" y="56" font-size="30" font-weight="800" fill="#0f172a">SteadyFrame on AWS</text>
  <text x="40" y="86" class="s">Every box is defined in AWS CDK (7 stacks). Idle cost is about zero: nothing runs between jobs.</text>

  <!-- browser -->
  <rect class="box" x="40" y="290" width="270" height="150" rx="16"/>
  <text x="62" y="330" class="h">Browser</text>
  <text x="62" y="360" class="s">React app on S3 + CloudFront</text>
  <text x="62" y="384" class="s">live demo, upload, job pages</text>
  <text x="62" y="408" class="s">flash-safe, WCAG AA</text>

  <!-- API -->
  <rect class="box" x="400" y="140" width="250" height="84" rx="14"/>
  <text x="420" y="176" class="h">API Gateway</text>
  <text x="420" y="204" class="s">HTTP API, /api/*</text>
  <rect class="compute" x="400" y="270" width="250" height="130" rx="14"/>
  <text x="420" y="306" class="h">API Lambda</text>
  <text x="420" y="334" class="s">Python 3.11, arm64</text>
  <text x="420" y="358" class="s">create job, presign, status,</text>
  <text x="420" y="380" class="s">trace, approve, download</text>

  <!-- queue -->
  <rect class="box" x="740" y="290" width="230" height="110" rx="14"/>
  <text x="760" y="328" class="h">SQS jobs queue</text>
  <text x="760" y="356" class="s">+ dead-letter queue</text>
  <text x="760" y="380" class="s">20 min visibility</text>

  <!-- workers -->
  <rect class="dash" x="1070" y="110" width="320" height="74" rx="14"/>
  <text x="1090" y="142" class="h">EventBridge, every 5 min</text>
  <text x="1090" y="168" class="s">keeps one worker warm</text>
  <rect class="compute" x="1070" y="230" width="320" height="160" rx="16"/>
  <text x="1090" y="266" class="h">Lambda worker</text>
  <text x="1090" y="294" class="s">arm64 (Graviton), 3 GB, container</text>
  <text x="1090" y="318" class="s">OpenCV 5 analyzer, repairs,</text>
  <text x="1090" y="342" class="s">ffmpeg, the agent loop</text>
  <text x="1090" y="370" class="l">about 4 s per job when warm</text>
  <rect class="dash" x="1070" y="430" width="320" height="90" rx="14"/>
  <text x="1090" y="466" class="h">ECS Fargate ARM64</text>
  <text x="1090" y="494" class="s">same container, fallback only</text>

  <!-- AI -->
  <rect class="ai" x="1440" y="230" width="230" height="160" rx="16"/>
  <text x="1460" y="266" class="h">Amazon Bedrock</text>
  <text x="1460" y="294" class="s">plans each repair</text>
  <text x="1460" y="318" class="s">through tool use</text>
  <text x="1460" y="342" class="s">sees numbers only,</text>
  <text x="1460" y="366" class="s">never pixels</text>

  <!-- data -->
  <rect class="data" x="300" y="640" width="290" height="110" rx="14"/>
  <text x="320" y="678" class="h">S3</text>
  <text x="320" y="706" class="s">uploads/, outputs/, samples/</text>
  <text x="320" y="730" class="s">private, encrypted, 1-day life</text>
  <rect class="data" x="660" y="640" width="290" height="110" rx="14"/>
  <text x="680" y="678" class="h">DynamoDB</text>
  <text x="680" y="706" class="s">jobs, traces</text>
  <text x="680" y="730" class="s">7-day TTL, on demand</text>
  <rect class="data" x="1070" y="640" width="320" height="110" rx="14"/>
  <text x="1090" y="678" class="h">CloudWatch</text>
  <text x="1090" y="706" class="s">JSON logs, metrics, dashboard,</text>
  <text x="1090" y="730" class="s">alarms and a cost budget, e-mail</text>

  <!-- flows -->
  <path class="ln" d="M310 330 C 350 330, 350 182, 398 182"/>
  <text x="318" y="250" class="l">REST</text>
  <path class="ln" d="M525 224 L525 268"/>
  <path class="ln" d="M650 345 L738 345"/>
  <text x="664" y="335" class="l">enqueue</text>
  <path class="ln" d="M175 440 L175 695 L298 695"/>
  <text x="186" y="600" class="l">presigned PUT</text>
  <path class="ln" d="M625 400 L625 695 L658 695"/>
  <text x="634" y="520" class="l">job records</text>
  <path class="ln" d="M970 320 L1068 300"/>
  <text x="982" y="296" class="l">1 job each</text>
  <path class="lnd" d="M970 380 L1068 470"/>
  <text x="842" y="432" class="l">if jobs wait 2 min</text>
  <path class="ln" d="M1230 184 L1230 228"/>
  <path class="ln2" d="M1392 310 L1438 310"/>
  <path class="bus" d="M1070 360 L1045 360 L1045 610"/>
  <path class="bus" d="M1070 475 L1045 475"/>
  <path class="bus" d="M1045 610 L445 610"/>
  <path class="ln" d="M445 610 L445 638"/>
  <path class="ln" d="M860 610 L860 638"/>
  <path class="ln" d="M1045 610 L1230 610 L1230 638"/>
  <text x="700" y="600" class="l">read inputs, write outputs, trace, metrics</text>
</svg>
